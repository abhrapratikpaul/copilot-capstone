<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 20px; }
    .add-form { display: flex; gap: 8px; margin-bottom: 12px; }
    .add-form input { flex: 1; padding: 8px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    .add-form button { padding: 8px 16px; font-size: 1rem; cursor: pointer; border: none; border-radius: 4px; background: #0969da; color: #fff; }
    .add-form button:hover { background: #0550ae; }
    #error-message { color: #d1242f; margin-bottom: 12px; min-height: 1.2em; }
    ul { list-style: none; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    li.completed .task-name { text-decoration: line-through; color: #888; }
    .task-name { flex: 1; }
    .delete-btn { background: none; border: none; color: #d1242f; cursor: pointer; font-size: 0.9rem; }
    .delete-btn:hover { text-decoration: underline; }
    #clear-completed { margin-top: 16px; padding: 8px 16px; font-size: 0.9rem; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    #clear-completed:hover { background: #f6f8fa; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>

  <div class="add-form">
    <input type="text" id="task-input" placeholder="Enter a task…" maxlength="200" aria-label="Task name">
    <button id="add-btn">Add Task</button>
  </div>
  <div id="error-message" role="alert"></div>

  <ul id="task-list"></ul>

  <button id="clear-completed">Clear Completed</button>

  <script>
    const API = '/api/tasks';
    const input = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const errorEl = document.getElementById('error-message');
    const listEl = document.getElementById('task-list');
    const clearBtn = document.getElementById('clear-completed');

    function showError(msg) { errorEl.textContent = msg; }
    function clearError() { errorEl.textContent = ''; }

    async function fetchTasks() {
      const res = await fetch(API);
      const tasks = await res.json();
      renderTasks(tasks);
    }

    function renderTasks(tasks) {
      listEl.innerHTML = '';
      tasks.forEach(t => {
        const li = document.createElement('li');
        if (t.completed) li.classList.add('completed');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = t.completed;
        cb.setAttribute('aria-label', 'Mark complete');
        cb.addEventListener('change', () => toggleTask(t.id, cb.checked));

        const span = document.createElement('span');
        span.className = 'task-name';
        span.textContent = t.name;

        const del_btn = document.createElement('button');
        del_btn.className = 'delete-btn';
        del_btn.textContent = 'Delete';
        del_btn.addEventListener('click', () => deleteTask(t.id));

        li.appendChild(cb);
        li.appendChild(span);
        li.appendChild(del_btn);
        listEl.appendChild(li);
      });
    }

    async function addTask() {
      clearError();
      const name = input.value.trim();
      if (!name) { showError('Task name is required'); return; }

      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });

      if (!res.ok) {
        const data = await res.json();
        showError(data.error || 'Failed to add task');
        return;
      }

      input.value = '';
      await fetchTasks();
    }

    async function toggleTask(id, completed) {
      await fetch(`${API}/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      await fetchTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      await fetchTasks();
    }

    async function clearCompleted() {
      await fetch(`${API}/completed`, { method: 'DELETE' });
      await fetchTasks();
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    clearBtn.addEventListener('click', clearCompleted);

    // Load tasks on page load
    fetchTasks();
  </script>
</body>
</html>
